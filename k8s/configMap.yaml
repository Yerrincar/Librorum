---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librorum-config
data:
  DB_MAX_OPEN_CONNS: "50"
  DB_MAX_IDLE_CONNS: "10"
  DB_MAX_IDLE_TIME: "36000"

  LIBRORUM_ADDR: ":4545"
  LIBRORUM_DATA_DIR: "data/"
  LIBRORUM_OPENLIBRARY_CONTACT: "your-email@example.com"

  SESSION_EXPIRATION: "24h"
  TOKEN_EXPIRATION: "15m"
---
